<!--
Regular dodecahedron with edge length 113.6mm, has:
 - Diameter 318.366 mm
 - Circumference (of circumscribing sphere) 1,000.18 mm
 - Circumference (of equator drawn on dodecahedron) 892.2 mm
The Earth has:
 - Polar diameter 12,714 km
 - Equatorial diameter 12,756 km
 - Average diameter 12,742 km  (± 20 km) 
 - Circumference (metric idealised sphere) 40,000 km
 - Circumference (Paris meridian great circle) 40,008 km
 - Circumference (of equator, at sea level) 40,074 km
 - Arc length of idealised sphere between two dodecahedron vertices 4,645.6 km
This map has scaling of 1 to:
 - 39,935,148 for polar diameter
 - 40,067,093 for equatorial diameter
 - 40,023,000 ±62,900 for Earth circumferences to circumference (of circumscribing sphere)
 - 40,894,366 for 40,000 km great circle arc length to dodecahedron edge length
 - 44,915,940 for equatorial diameter to equator drawn on dodecahedron
One millimetre is approximately 40 km, except elevation is scaled at 800:1 (above sea level).
So Everest is 11mm above sea level on the pentagon.
-->
